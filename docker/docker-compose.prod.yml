services:
  api:
    container_name: api-prod
    image: 104266513708.dkr.ecr.ap-northeast-2.amazonaws.com/near05-api:${IMAGE_TAG}
    environment:
      - MODE=prod
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    env_file:
      - ../envs/.prod.env
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ws]
    restart: always

  db:
    image: postgres:14
    container_name: postgres-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw1234
      POSTGRES_DB: near05_db
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d near05_db"]
      interval: 5s
      retries: 5
    networks: [ws]
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: always

  redis:
    image: redis:7
    container_name: redis-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    networks: [ws]
    restart: always

networks:
  ws: { driver: bridge }
volumes:
  postgres_data: