[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerich>=0.9.2",
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.42.26, <1.43",
    "celery>=5.6.2",
    "cryptography>=46.0.3",
    "fastapi>=0.128.0",
    "fastapi-admin>=1.0.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.1",
    "redis[hiredis]>=7.1.0",
    "tortoise-orm>=0.25.3",
    "types-redis>=4.6.0.20241004",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[ec2,ecr,ivs,cognito-idp]>=1.42.26, <1.43",
    "coverage>=7.13.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.aerich]
tortoise_orm = "app.core.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
env_files = ["envs/.local.env"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "-v",
]


[tool.ruff]
target-version = "py313"
line-length = 100
cache-dir = ".cache/ruff"
exclude = [
    "migrations",
    ".cache",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "TCH"]
ignore = ["B008"] # FastAPI의 Depends 사용을 위해 추가

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = 3.13
strict = true
ignore_missing_imports = true
cache_dir = ".cache/mypy"
exclude = [
    "migrations/",
    "tests/",
]

[tool.coverage.run]
data_file = ".cache/coverage/.coverage"
source = ["app"]
omit = [
    "*/test_*.py",
    "*/models.py",
    "*/schemas.py",
    "app/core/config.py",
    "app/core/tortoise_config.py",
    "app/main.py",
    "migrations/*",
]

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.xml]
output = ".cache/coverage/coverage.xml"

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
