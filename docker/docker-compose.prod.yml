#! 수정이 필요함.
services:
  api:
    container_name: api
    build:
      context: ..
      dockerfile: docker/DockerFile
    env_file:
      - ../envs/.local.env
    working_dir: /app
    command: >
      sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    networks:
      - ws
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  ws:
    driver: bridge

volumes:
  postgres_data: