AWSTemplateFormatVersion: "2010-09-09"
Description: ECR + ECS Fargate Service for FastAPI (no ALB, AssignPublicIp optional)

Parameters:
  AppName:
    Type: String
    Default: near05-backend

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for ECS tasks

  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for ECS tasks (public subnets if AssignPublicIp=ENABLED)

  AssignPublicIp:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]

  ContainerPort:
    Type: Number
    Default: 8000

  Cpu:
    Type: String
    Default: "256"

  Memory:
    Type: String
    Default: "512"

  DesiredCount:
    Type: Number
    Default: 1

  DbSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for RDS (PRIVATE subnets recommended)

  DbName:
    Type: String
    Default: near05_db

  DbUsername:
    Type: String
    Default: postgres

  DbPassword:
    Type: String
    NoEcho: true
    Description: Master password for RDS (pass from GitHub Secret)

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t3.micro
      - db.t3.small

  DbAllocatedStorage:
    Type: Number
    Default: 20

  DbPubliclyAccessible:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-basic
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName}-${Environment}-ecs-sg"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AppName}-${Environment}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: "public.ecr.aws/docker/library/nginx:latest" # 최초 더미 (CD가 실제 이미지로 교체)
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          Environment:
            - Name: APP_ENV
              Value: !Ref Environment

  Service:
    Type: AWS::ECS::Service
    DependsOn: [TaskDefinition]
    Properties:
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref PublicSubnets
          SecurityGroups:
            - !Ref ServiceSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName}-${Environment}-db-sg"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AppName}-${Environment}-db-subnets"
      SubnetIds: !Ref DbSubnets

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceIdentifier: !Sub "${AWS::StackName}-postgres"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3

      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword

      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup

      PubliclyAccessible: !Ref DbPubliclyAccessible
      BackupRetentionPeriod: 7
      MultiAZ: false
      DeletionProtection: false

Outputs:
  EcrRepositoryName:
    Value: !Ref EcrRepository

  TaskFamily:
    Value: !Sub "${AppName}-${Environment}"

  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri

  ClusterName:
    Value: !Ref Cluster

  ServiceName:
    Value: !GetAtt Service.Name

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn

  LogGroupName:
    Value: !Ref LogGroup

  ContainerName:
    Value: "app"

  DbHost:
    Value: !GetAtt DbInstance.Endpoint.Address

  DbPort:
    Value: !GetAtt DbInstance.Endpoint.Port

  DbNameOut:
    Value: !Ref DbName

  DbUserOut:
    Value: !Ref DbUsername