name: Code Quality Checks

# develop, main 브랜치를 상대로 풀 리퀘스트가 생성될 때 CI가 실행됩니다.
on:
  pull_request:
    branches:
      - "main"
      - "develop"

permissions:
  contents: read

jobs:
  ci:
    # 코드 품질 검사(린트/포맷/타입체크) job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # uv 설치 및 기본 캐시 활성화
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # uv 다운로드/휠 캐시를 저장하여 의존성 설치 속도를 개선합니다.
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          # uv.lock이 바뀌지 않으면 캐시 재사용
          key: uv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-lock-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-

      # 개발 의존성까지 포함하여 잠금 파일 기준으로 설치합니다.
      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .


  test:
    # DB/Redis가 필요한 테스트를 수행하는 job
    runs-on: ubuntu-latest

    services:
      # postgresql db service
      db:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: near05_db
          TZ: Asia/Seoul
        options: >-
          --health-cmd "pg_isready -U postgres -d near05_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # redis service
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-lock-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: uv sync --dev --locked

      # 로컬과 동일하게 env 파일을 생성합니다.
      # 단, GitHub Actions services는 보통 localhost로 접근하는 것이 안전해서 CI에서는 HOST를 127.0.0.1로 설정합니다.
      - name: Create env file (envs/.local.env)
        run: |
          mkdir -p envs
          cat > envs/.local.env <<EOF
          SECRET_KEY=${{ secrets.APP_SECRET_KEY }}

          DB_NAME=near05_db
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=127.0.0.1
          DB_PORT=5432

          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          EOF

      # 테스트 실행 (pytest)
      - name: Pytest
        env:
          # 테스트 실행 시 환경변수를 확실히 주입(앱이 env 파일을 안 읽는 구조여도 안정적으로 동작)
          DB_NAME: near05_db
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: uv run pytest -q

      # 커버리지(coverage) 보고
      - name: Coverage (report)
        env:
          DB_NAME: near05_db
          DB_USER: postgres
          DB_PASSWORD: pw1234
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report -m