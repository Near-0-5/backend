name: Deploy Dev to EC2

on:
  pull_request:
    branches:
      - "develop"
    types:
      - closed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: | 
      github.event.pull_request.merged == true &&
      vars.ENABLE_EC2_DEPLOY == 'true'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: near05-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f docker/DockerFile .

          docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: near05-api
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,REPOSITORY,IMAGE_TAG
          script: |
            set -e
            cd ~/app
            
            # IMAGE_TAG를 docker-compose에 전달
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.dev.yml pull
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.dev.yml up -d --wait
            
            # 마이그레이션 실행
            echo "Running database migrations..."
            docker compose -f docker-compose.dev.yml exec -T api uv run aerich upgrade
            
            # 오래된 이미지 정리            
            docker image prune -af --filter "until=72h" || true
            
            echo "[Success] Deployment successful"