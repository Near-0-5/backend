name: Code Quality Checks

# develop, main 브랜치를 상대로 풀 리퀘스트가 생성될 때 or 직접 푸쉬할 때CI가 실행됩니다.
on:
  push:
    branches:
      - "main"
      - "develop"

  pull_request:
    branches:
      - "main"
      - "develop"

permissions:
  contents: read

# 동일 PR에 새 커밋이 올라오면 이전 실행을 취소하여 자원을 절약합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # 코드 품질 검사(린트/포맷/타입체크) job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true # uv 의존성 캐싱 자동 처리
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff (lint & format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (type check)
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.13

    services:
      db:
        image: postgres:14

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: near05_db
          TZ: Asia/Seoul
        options: >-
          --health-cmd "pg_isready -U postgres -d near05_db"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 3

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 3

    env:
      # GitHub Secrets에서 가져온 값을 환경변수로 매핑
      MODE: local
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

      DB_SCHEME: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: near05_db
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      STREAM_KEY_ENCRYPTION_KEY: ${{ secrets.STREAM_KEY_ENCRYPTION_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-2
      IVS_PLAYBACK_PRIVATE_KEY_B64: ${{ secrets.IVS_PLAYBACK_PRIVATE_KEY_B64 }}
      S3_RECORDING_BUCKET: my-concert-ivs-recordings

      ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      AUTO_SCHEMA: "1"

      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      KAKAO_REST_API_KEY: "aa01acb6e04a9e4c04543d5834ee68ae"
      KAKAO_REDIRECT_URI: "http://52.78.124.109:8000/auth/kakao/callback"
      KAKAO_CLIENT_SECRET: "GPFeAF5PbNB41dSF2iTBdwSKoD1krunt"
      KAKAO_ADMIN_KEY: "be42a537604c50c5673929aa78daa7e5"
      CALLBACK_REDIRECT_URL: "http://52.78.124.109:8000/docs"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run Test with Coverage
        timeout-minutes: 10

        run: uv run pytest