name: CD (ECR + ECS via CloudFormation)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
    types: [closed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

  APP_STACK_NAME: near05-dev-backend

  APP_NAME: near05-backend
  APP_ENV: dev

  CONTAINER_NAME: app
  CONTAINER_PORT: "8000"
  TASK_CPU: "256"
  TASK_MEMORY: "512"

jobs:
  deploy:
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install envsubst + jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext-base jq

      - name: Delete stack if ROLLBACK_COMPLETE
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks --stack-name "${APP_STACK_NAME}" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Stack status: ${STATUS}"

          if [ "${STATUS}" = "ROLLBACK_COMPLETE" ]; then
            echo "Deleting stack ${APP_STACK_NAME} (ROLLBACK_COMPLETE)..."
            aws cloudformation delete-stack --stack-name "${APP_STACK_NAME}"
            aws cloudformation wait stack-delete-complete --stack-name "${APP_STACK_NAME}"
            echo "Deleted."
          fi

      - name: Deploy CloudFormation stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "${APP_STACK_NAME}" \
            --template-file "infra/cfn/10-ecs-fargate.yml" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              AppName="${APP_NAME}" \
              Environment="${APP_ENV}" \
              VpcId="${{ secrets.VPC_ID }}" \
              PublicSubnets="${{ secrets.PUBLIC_SUBNETS }}" \
              AssignPublicIp="ENABLED" \
              ContainerPort="${CONTAINER_PORT}" \
              Cpu="${TASK_CPU}" \
              Memory="${TASK_MEMORY}" \
              DesiredCount="1" \
              DbSubnets="${{ secrets.DB_SUBNETS }}" \
              DbName="${{ secrets.DB_NAME }}" \
              DbUsername="${{ secrets.DB_USER }}" \
              DbPassword="${{ secrets.DB_PASSWORD }}" \
              DbPubliclyAccessible="false"

      - name: Dump CloudFormation events on failure
        if: failure()
        run: |
          aws cloudformation describe-stacks --stack-name "${APP_STACK_NAME}" || true
          aws cloudformation describe-stack-events --stack-name "${APP_STACK_NAME}" --max-items 50 || true

      - name: Read CloudFormation outputs
        run: |
          set -euo pipefail

          OUT=$(aws cloudformation describe-stacks --stack-name "${APP_STACK_NAME}" \
            --query "Stacks[0].Outputs" --output json)

          echo "$OUT" > outputs.json

          get() {
            local key="$1"
            jq -r --arg k "$key" '.[] | select(.OutputKey==$k) | .OutputValue' outputs.json | head -n 1
          }

          echo "ECR_URI=$(get EcrRepositoryUri)" >> $GITHUB_ENV
          echo "ECR_NAME=$(get EcrRepositoryName)" >> $GITHUB_ENV
          echo "ECS_CLUSTER=$(get ClusterName)" >> $GITHUB_ENV
          echo "ECS_SERVICE=$(get ServiceName)" >> $GITHUB_ENV

          TASK_FAMILY="$(get TaskFamily)"
          if [ -z "${TASK_FAMILY}" ] || [ "${TASK_FAMILY}" = "null" ]; then
            TASK_FAMILY="${APP_NAME}-${APP_ENV}"
          fi
          echo "TASK_FAMILY=${TASK_FAMILY}" >> $GITHUB_ENV

          echo "TASK_EXEC_ROLE_ARN=$(get TaskExecutionRoleArn)" >> $GITHUB_ENV
          echo "TASK_ROLE_ARN=$(get TaskRoleArn)" >> $GITHUB_ENV
          echo "LOG_GROUP=$(get LogGroupName)" >> $GITHUB_ENV

          # RDS outputs
          echo "DB_HOST=$(get DbHost)" >> $GITHUB_ENV
          echo "DB_PORT=$(get DbPort)" >> $GITHUB_ENV
          echo "DB_NAME=$(get DbNameOut)" >> $GITHUB_ENV
          echo "DB_USER=$(get DbUserOut)" >> $GITHUB_ENV

          echo "Resolved TASK_FAMILY=${TASK_FAMILY}"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE_URI="${ECR_URI}:${IMAGE_TAG}"

          docker build -f docker/DockerFile -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Render task-definition.json (envsubst)
        run: |
          set -euo pipefail

          export AWS_REGION="${AWS_REGION}"
          export IMAGE_URI="${IMAGE_URI}"
          export TASK_FAMILY="${TASK_FAMILY}"
          export TASK_EXEC_ROLE_ARN="${TASK_EXEC_ROLE_ARN}"
          export TASK_ROLE_ARN="${TASK_ROLE_ARN}"
          export LOG_GROUP="${LOG_GROUP}"
          export APP_ENV="${APP_ENV}"
          export CONTAINER_NAME="${CONTAINER_NAME}"
          export CONTAINER_PORT="${CONTAINER_PORT}"
          export TASK_CPU="${TASK_CPU}"
          export TASK_MEMORY="${TASK_MEMORY}"

          # DB env (RDS outputs + GitHub secret password)
          export DB_SCHEME="postgres"
          export DB_HOST="${DB_HOST}"
          export DB_PORT="${DB_PORT}"
          export DB_NAME="${DB_NAME}"
          export DB_USER="${DB_USER}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          export MODE="${APP_ENV}"
          export AWS_REGION="${AWS_REGION}"

          # redis
          export REDIS_HOST="redis"
          export REDIS_PORT="6379"

          # s3
          export S3_RECORDING_BUCKET="${{ secrets.S3_RECORDING_BUCKET }}"

          # secrets / admin (FastAPI)
          export SECRET_KEY="${{ secrets.SECRET_KEY }}"
          export STREAM_KEY_ENCRYPTION_KEY="${{ secrets.STREAM_KEY_ENCRYPTION_KEY }}"

          export ADMIN_SECRET_KEY="${{ secrets.ADMIN_SECRET_KEY }}"
          export ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}"
          export ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"

          : "${DB_HOST:?DB_HOST is required}"
          : "${DB_PASSWORD:?DB_PASSWORD is required}"

          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"

          : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID secret missing/empty}"
          : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY secret missing/empty}"

          envsubst < infra/ecs/task-definition.json.tmpl > task-definition.json

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
