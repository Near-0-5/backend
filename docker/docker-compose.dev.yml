services:
  api:
    container_name: api
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      - MODE=dev
      - UV_PROJECT_ENVIRONMENT=/tmp/venv-api
    env_file:
      - ../envs/.dev.env
    working_dir: /app
    command: >
      sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    networks:
      - ws
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    container_name: celery-worker
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      - MODE=dev
      - UV_PROJECT_ENVIRONMENT=/tmp/venv-worker
    env_file:
      - ../envs/.dev.env
    working_dir: /app
    command: >
      sh -c "uv run celery -A app.tasks.celery_app worker -l info"
    volumes:
      - ..:/app
    networks:
      - ws
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    container_name: celery-beat
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      - MODE=dev
      - UV_PROJECT_ENVIRONMENT=/tmp/venv-beat
    env_file:
      - ../envs/.dev.env
    working_dir: /app
    command: >
      sh -c "mkdir -p /app/.cache && uv run celery -A app.tasks.celery_app beat -l info --schedule /app/.cache/celerybeat-schedule"
    volumes:
      - ..:/app
    networks:
      - ws
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw1234
      POSTGRES_DB: near05_db
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ws
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d near05_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ws
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  ws:
    driver: bridge

volumes:
  postgres_data:
