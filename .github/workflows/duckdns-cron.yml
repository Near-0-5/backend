name: DuckDNS Cron Update (ECS Public IP)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (UTC 기준이지만 10분 주기는 상관없음)

permissions:
  id-token: write
  contents: read

concurrency:
  group: duckdns-update
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: near05-dev-backend-Cluster-AwZpBkO2kAVz
  ECS_SERVICE: near05-dev-backend-Service-EVErXUDIQuXN

jobs:
  update-duckdns:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update DuckDNS to current RUNNING task public IP
        env:
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          set -euo pipefail

          echo "Finding RUNNING task for service..."
          TASK_ARN="$(aws ecs list-tasks \
            --cluster "${ECS_CLUSTER}" \
            --service-name "${ECS_SERVICE}" \
            --desired-status RUNNING \
            --query "taskArns[0]" \
            --output text)"

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "No RUNNING task found"
            exit 1
          fi
          echo "TASK_ARN=${TASK_ARN}"

          echo "Getting ENI from task..."
          ENI_ID="$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
            --output text)"

          if [ -z "${ENI_ID}" ] || [ "${ENI_ID}" = "None" ]; then
            echo "ENI_ID not found"
            exit 1
          fi
          echo "ENI_ID=${ENI_ID}"

          echo "Getting Public IP from ENI..."
          PUBLIC_IP="$(aws ec2 describe-network-interfaces \
            --network-interface-ids "${ENI_ID}" \
            --query "NetworkInterfaces[0].Association.PublicIp" \
            --output text)"

          if [ -z "${PUBLIC_IP}" ] || [ "${PUBLIC_IP}" = "None" ]; then
            echo "Public IP not found (AssignPublicIp disabled or association missing)"
            exit 1
          fi
          echo "PUBLIC_IP=${PUBLIC_IP}"

          echo "Updating DuckDNS..."
          RES="$(curl -fsS "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=${PUBLIC_IP}")"
          echo "DuckDNS response: ${RES}"

          echo "URL: http://${DUCKDNS_DOMAIN}.duckdns.org:8000/docs"
