AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC Provider + Deploy Role for CloudFormation/ECS/ECR

Parameters:
  GitHubOrg:
    Type: String
    Default: Near-0-5
  GitHubRepo:
    Type: String
    Default: backend
  RoleName:
    Type: String
    Default: near05-github-actions-deploy-role

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub OIDC thumbprint(업데이트 가능성 있지만 일반적으로 이 값 사용)
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # 처음엔 넓게(디버깅 쉬움). 나중에 브랜치 제한 가능.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"

      Policies:
        - PolicyName: near05-deploy-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation 배포/조회
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:Describe*
                  - cloudformation:Get*
                  - cloudformation:List*
                Resource: "*"

              # ECR(로그인 + push)
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:TagResource
                Resource: "*"

              # ECS 배포/조회
              - Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:Describe*
                  - ecs:List*
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                Resource: "*"

              # EC2 네트워크 리소스 조회(서브넷/보안그룹 등)
              - Effect: Allow
                Action:
                  - ec2:Describe*
                Resource: "*"

              # CloudWatch Logs 생성/조회
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource: "*"

              # IAM Role 생성/수정(스택이 Role 만들기 때문에 필요)
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:PassRole
                Resource: "*"

Outputs:
  RoleArn:
    Description: GitHub Actions assumes this role
    Value: !GetAtt GitHubDeployRole.Arn
