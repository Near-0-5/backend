[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aerich>=0.9.2",
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.42.26",
    "cryptography>=46.0.3",
    "fastapi>=0.128.0",
    "fastapi-admin>=1.0.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "tortoise-orm>=0.25.3",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.1",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.14.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.aerich]
tortoise_orm = "app.core.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
env_files = ["envs/.local.env"]

[tool.ruff]
target-version = "py313"
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = 3.13
strict = true
ignore_missing_imports = true
cache_dir = ".cache/mypy"

[tool.coverage.run]
data_file = ".cache/coverage/.coverage"
source = ["app"]
omit = ["*/test_*.py"]

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.xml]
output = ".cache/coverage/coverage.xml"

[tool.coverage.report]
show_missing = true
skip_covered = true
