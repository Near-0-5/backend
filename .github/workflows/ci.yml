name: Code Quality Checks

# develop, main 브랜치를 상대로 풀 리퀘스트가 생성될 때 CI가 실행됩니다.
on:
  pull_request:
    branches:
      - "main"
      - "develop"

permissions:
  contents: read

# 동일 PR에 새 커밋이 올라오면 이전 실행을 취소하여 자원을 절약합니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # 코드 품질 검사(린트/포맷/타입체크) job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true # uv 의존성 캐싱 자동 처리

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff (lint & format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (type check)
        run: uv run mypy .

  test:
    # CI 단계가 성공해야 테스트를 실행합니다.
    needs: ci
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: near05_db
          TZ: Asia/Seoul
        options: >-
          --health-cmd "pg_isready -U postgres -d near05_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # GitHub Secrets에서 가져온 값을 환경변수로 매핑
      MODE: local
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_SCHEME: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: near05_db
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      STREAM_KEY_ENCRYPTION_KEY: ${{ secrets.STREAM_KEY_ENCRYPTION_KEY }}
      ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123!
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-2
      S3_RECORDING_BUCKET: my-concert-ivs-recordings
      AUTO_SCHEMA: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run Pytest and Coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m --fail-under=80